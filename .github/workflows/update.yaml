name: cavuno-update
on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - run: pnpm install --frozen-lockfile
      # No release tag exists yet; pin the reviewed main commit because this
      # action receives an API key and repository write permissions.
      - uses: wollemiahq/cavuno-update-action@26cda3534d87434eebfc3e0b95ac03a0ac9f9bf0
        env:
          PUBLIC_CAVUNO_API_URL: https://api.cavuno.com
          PUBLIC_CAVUNO_BOARD: pk_d9ce40a106227b615ec710de3f3d73dc
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
