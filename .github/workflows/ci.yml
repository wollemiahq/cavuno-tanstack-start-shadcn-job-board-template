name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and formatting
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # DESIGN.md + design/tokens.dtcg.json are generated artifacts —
      # regenerate them and reject any drift or hand-edit.
      - name: Design artifacts check
        run: pnpm run gen:design -- --check

      - name: Build
        run: pnpm run build

      - name: Client bundle budgets
        run: pnpm run check:bundle

  # Conformance gate: verifies board capability, not markup.
  # Tier 1 static + tier 2 read probes against THIS starter's built
  # frontend + tier 3 write probes against the platform sandbox board
  # (writes are refused server-side unless the board is marked test, so
  # the doctor job points the frontend at the sandbox pk).
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Point the frontend at the sandbox board
        run: |
          printf 'CAVUNO_API_URL=https://api.cavuno.com\nCAVUNO_BOARD=%s\n' "$PUBLIC_CAVUNO_BOARD" > .dev.vars
        env:
          PUBLIC_CAVUNO_BOARD: pk_c2f66367a3abaa6bafd00fd3c2de3297

      - name: Build
        run: pnpm run build

      - name: Serve the built worker
        run: |
          pnpm exec vp preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/ && exit 0
            sleep 1
          done
          echo 'preview server never became ready' >&2
          exit 1

      - name: Doctor (all three tiers)
        # @cavuno/board 1.44.0 scans every JS file under src/ and mistakes
        # Paraglide's generated browser cookie helper for an app-owned,
        # domain-scoped session-cookie write. Hide only that generated,
        # gitignored directory for the static scan; always restore it so the
        # pseudo-locale gate below keeps the ordinary build workspace intact.
        run: |
          mv src/paraglide src/.paraglide-doctor-ignore
          trap 'mv src/.paraglide-doctor-ignore src/paraglide' EXIT
          pnpm exec cavuno-board doctor --frontend http://localhost:4173 --sandbox
        env:
          PUBLIC_CAVUNO_API_URL: https://api.cavuno.com
          PUBLIC_CAVUNO_BOARD: pk_c2f66367a3abaa6bafd00fd3c2de3297

      # Pseudo-locales (en-XA / ar-XB) are QA-only and are NOT in the default
      # project.inlang/settings.json locales array, so the prod build above
      # (and job 1 budgets) never ships them. Re-enable, rebuild, and re-serve
      # only for the gate; restore settings afterward so the workspace stays
      # clean if a later step fails.
      # Catalog-backed chrome must render pseudo-localized on /en-XA/ and
      # /ar-XB/ — proves URL locale → middleware → seam → messages end to end.
      # /ar-XB/ additionally pins the RTL contract: the document serves
      # dir="rtl" there and dir="ltr" on every real locale.
      - name: Pseudo-locale gate
        run: |
          node scripts/pseudo-locale-enable.mjs
          trap 'git checkout -- project.inlang/settings.json' EXIT
          pnpm run build
          # Restart preview with the pseudo-enabled build (same port as doctor).
          if command -v lsof >/dev/null 2>&1; then
            lsof -ti TCP:4173 -sTCP:LISTEN | xargs -r kill || true
          else
            fuser -k 4173/tcp || true
          fi
          sleep 1
          pnpm exec vp preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 1
            if [ "$i" -eq 30 ]; then
              echo 'preview server never became ready for pseudo gate' >&2
              exit 1
            fi
          done
          node scripts/pseudo-locale-gate.mjs http://localhost:4173

  # After verify+doctor on the default branch: ask cavuno to rebake the
  # sandbox-host image at this SHA. Secrets stay in cavuno — this job
  # only dispatches. Skip when CAVUNO_DISPATCH_TOKEN is unset so forks
  # and a missing secret cannot fail CI. Never put Cloudflare or Convex
  # credentials in this repository.
  dispatch-bake:
    name: Dispatch cavuno bake
    needs: [verify, doctor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'wollemiahq/cavuno-tanstack-start-shadcn-job-board-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch bake-starter
        env:
          CAVUNO_DISPATCH_TOKEN: ${{ secrets.CAVUNO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$CAVUNO_DISPATCH_TOKEN" ]; then
            echo "CAVUNO_DISPATCH_TOKEN unset — skipping bake dispatch"
            exit 0
          fi
          payload="$(jq -nc --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '{event_type:"bake-starter",client_payload:{sha:$sha,repo:$repo}}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CAVUNO_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/wollemiahq/cavuno/dispatches \
            -d "$payload"
